<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TagSense</title>
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --text: #1c1f23; --muted: #66707a; --line: #dde1e6;
  --accent: #0b74c4; --accent-text: #ffffff; --ok: #2e7d32; --warn: #b26a00; --bad: #c62828;
  --chip-present: #e3f3e4; --chip-absent: #eceff1; --chip-unknown: #fff1d6;
  --crop: #ffb300; --usual: #00b8d4; --quad: #43a047;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --card: #1b1f24; --text: #e6e8eb; --muted: #9aa4ae; --line: #2c333a;
    --accent: #4aa3e8; --accent-text: #0b1117; --ok: #66bb6a; --warn: #ffb74d; --bad: #ef5350;
    --chip-present: #1d3a22; --chip-absent: #262c33; --chip-unknown: #3d3016;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
/* shell: a sidebar on wide screens, a tab bar on phones (one markup, restyled below) */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
nav#nav { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--card);
  border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
nav .brand { padding: 0 10px 14px; }
nav .brand a { font-size: 18px; font-weight: 600; color: var(--text); }
nav .tab { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; color: var(--text);
  font-weight: 600; }
nav .tab:hover, nav .sub a:hover { background: var(--bg); }
nav .tab.active { background: var(--accent); color: var(--accent-text); }
nav .tab .badge { margin-left: auto; font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px;
  background: var(--chip-absent); color: var(--muted); }
nav .sub { display: flex; flex-direction: column; margin: 2px 0 8px 12px; }
nav .sub a { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 6px;
  color: var(--text); font-size: 13px; }
nav .sub a.active { background: var(--bg); font-weight: 600; }
nav .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
nav .tab .badge.warn { background: var(--chip-unknown); color: var(--warn); }
nav .dot.present { background: var(--ok); } nav .dot.unknown { background: var(--warn); }
nav .who { margin-top: auto; padding: 14px 10px 0; }
body.solo .shell { display: block; } body.solo nav#nav { display: none; }
main { max-width: 1100px; width: 100%; margin: 0 auto; padding: 20px; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar h2 { font-size: 20px; margin: 0; flex: 1; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0 16px; }
.setup { list-style: none; padding: 0; margin: 10px 0 6px; }
.setup li { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.setup .tick { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line);
  display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.setup li.ok .tick { background: var(--ok); border-color: var(--ok); color: var(--card); }
.setup li.ok { color: var(--muted); }
.testbox ol { padding-left: 20px; margin: 0 0 8px; } .testbox li { margin: 6px 0; }
.savebar { position: sticky; bottom: 0; z-index: 3; box-shadow: 0 -2px 8px rgba(0,0,0,.08); }
@media (max-width: 859px) {
  .shell { display: block; }
  nav#nav { position: sticky; z-index: 5; height: auto; flex-direction: row; align-items: center; overflow-x: auto;
    border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; gap: 4px; }
  nav .brand { display: none; }     /* Home Assistant already shows the title on a phone */
  nav .sub, nav .who { display: none; }
  nav .tab { padding: 6px 10px; white-space: nowrap; }
}
a { color: var(--accent); text-decoration: none; }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
  padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.btn.primary, button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.card h2 { font-size: 16px; margin: 0 0 4px; }
.card h3 { font-size: 14px; margin: 0 0 10px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; }
.chip.present { background: var(--chip-present); color: var(--ok); }
.chip.absent { background: var(--chip-absent); color: var(--muted); }
.chip.unknown { background: var(--chip-unknown); color: var(--warn); }
.thumb { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #000; border-radius: 6px;
  margin: 10px 0; display: block; }
.thumb.empty { display: flex; align-items: center; justify-content: center; color: #999; }
.card, .cols > * { min-width: 0; }
.card { overflow-wrap: anywhere; }
table { table-layout: fixed; }
.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 800px) { .cols { grid-template-columns: 1fr; } main { padding: 12px; }
  .card { padding: 12px; } }
.stack > * + * { margin-top: 16px; }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
.kv td:first-child { color: var(--muted); width: 45%; }
label { display: block; margin: 10px 0 4px; font-weight: 600; }
input, select { font: inherit; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--text); }
input[type=checkbox], input[type=radio] { width: auto; margin: 0 4px 0 0; vertical-align: -1px; }
label.inline { display: inline-flex; align-items: center; margin: 0 16px 0 0; font-weight: 400; }
.hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
.error { color: var(--bad); margin: 8px 0; white-space: pre-wrap; }
.notice { background: var(--chip-unknown); color: var(--text); padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; }

/* crop editor */
.editor { position: relative; user-select: none; touch-action: none; background: #000; border-radius: 6px;
  overflow: hidden; line-height: 0; }
.editor img { width: 100%; display: block; }
.editor svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.crop { position: absolute; border: 2px solid var(--crop); cursor: move; }
.handle { position: absolute; width: 14px; height: 14px; background: var(--crop); border: 2px solid #000;
  border-radius: 3px; }
.h-nw { left: -8px; top: -8px; cursor: nwse-resize; } .h-ne { right: -8px; top: -8px; cursor: nesw-resize; }
.h-sw { left: -8px; bottom: -8px; cursor: nesw-resize; } .h-se { right: -8px; bottom: -8px; cursor: nwse-resize; }
.legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; }
.legend i { width: 12px; height: 12px; display: inline-block; border-radius: 2px; }
.notice.alert { border-left: 4px solid var(--warn); }
.notice .row { margin-top: 8px; }
/* 24h chart */
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; line-height: 1.4; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  white-space: nowrap; display: none; z-index: 2; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .series { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .wash { fill: var(--accent); opacity: .1; stroke: none; }
.chart .ceiling { fill: none; stroke: var(--muted); stroke-width: 1; opacity: .6; }
.chart .limit { stroke: var(--warn); stroke-width: 1; }
.chart .cross { stroke: var(--text); stroke-width: 1; opacity: .5; }
.key i { width: 10px; height: 10px; display: inline-block; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.snaps { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.snaps a, .snaps div.snap { display: block; color: inherit; font-size: 12px; }
.snaps img, .snaps .noimg { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #000; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; color: #999; }
textarea { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; width: 100%; min-height: 140px; padding: 8px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); resize: vertical; }
.loading { padding: 40px; text-align: center; color: #aaa; line-height: 1.4; }
</style>
</head>
<body>
<div class="shell">
<nav id="nav">
  <div class="brand"><a href="#/">TagSense</a> <span class="muted small" id="version"></span></div>
  <a class="tab" href="#/" data-sec="presence">Presence</a>
  <div class="sub" id="nav-objects"></div>
  <a class="tab" href="#/access" data-sec="access">Access <span class="badge" id="access-off" style="display:none">off</span></a>
  <div class="sub" id="nav-scanners"></div>
  <a class="tab" href="#/settings" data-sec="settings">Settings</a>
  <a class="tab" href="#/health" data-sec="health">Health <span class="badge warn" id="health-badge" style="display:none"></span></a>
  <a class="tab" href="#/pass" data-sec="pass">My pass</a>
  <div class="who muted small" id="whoami"></div>
</nav>
<main id="main"><div class="loading">Loading…</div></main>
</div>

<script>
"use strict";
const $main = document.getElementById("main");
let state = { objects: [] };
let timer = null;
let editorDirty = false;

// ---------- helpers -------------------------------------------------------
async function api(path, opts = {}) {
  const init = { method: opts.method || "GET", headers: {} };
  if (opts.body !== undefined) {
    init.body = JSON.stringify(opts.body);
    init.headers["Content-Type"] = "application/json";
  }
  const r = await fetch("api/" + path, init);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ago(iso) {
  if (!iso) return "never";
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 5) return "just now";
  if (s < 90) return s + " s ago";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 129600) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}
const chip = (st, reason) => `<span class="chip ${esc(st)}">${esc(st)}</span>
  <span class="muted small">${esc(reason || "")}</span>`;
const objById = id => state.objects.find(o => o.id === id);
function fmtNum(v, d = 1) { return v === null || v === undefined ? "–" : (typeof v === "number" ? v.toFixed(d) : esc(v)); }

// Read-only (0.5.0b7): checks that the panel can tell who is using it, ahead of
// the "My pass" page. It changes nothing.
async function showWhoami() {
  let w = null;
  try {
    w = await api("whoami");
    const el = document.getElementById("whoami");
    el.textContent = !w.header_present ? "signed-in user: not provided by Home Assistant"
      : w.lookup_error ? `signed in as ${w.name || "?"} · admin status unknown (${w.lookup_error})`
      : `signed in as ${w.name || "?"} · ${w.found ? (w.admin ? "admin" : "not an admin") : "not found in the user list"}`;
    if (w.users && w.users.length) el.title = "Home Assistant users as TagSense sees them:\n" +
      w.users.map(u => `${u.name}: ${u.admin ? "admin" : "not an admin"}${u.active ? "" : " (inactive)"}`).join("\n");
  } catch (e) { /* older back end */ }
  return w;
}

// ---------- "My pass" (every signed-in user) --------------------------------
// The code is drawn by the server every period, so the phone's clock does not
// matter. Only the signed-in user's own pass is ever returned.
let passTimer = null, passTick = null;
function passInverted() { try { return localStorage.getItem("tagsense-pass-invert") === "1"; } catch (e) { return false; } }
function setPassInverted(on) {
  try { localStorage.setItem("tagsense-pass-invert", on ? "1" : "0"); } catch (e) { /* not remembered */ }
  const img = document.getElementById("pass-img");
  if (img) { img.src = `api/pass.png?t=${Date.now()}${on ? "&invert=1" : ""}`; img.style.background = on ? "#000" : "#fff"; }
}
async function passPage(w) {
  clearTimeout(passTimer); clearInterval(passTick);
  let info;
  try { info = await api("pass"); }
  catch (e) {
    $main.innerHTML = `<div class="card" style="max-width:520px;margin:auto"><h2>TagSense</h2>
      <p class="muted">${esc(e.message === "not signed in" ? "Open TagSense from the Home Assistant sidebar." : e.message)}</p></div>`;
    return;
  }
  if (!info.available || !info.has_pass) {
    $main.innerHTML = `<div class="card" style="max-width:520px;margin:auto"><h2>${info.available ? "No pass yet" : "Nothing here for you"}</h2>
      <p class="muted">${info.available
        ? "You don't have a pass. Ask a Home Assistant admin to add one (TagSense → Access → Passes)."
        : "TagSense's settings are for Home Assistant admins."}</p></div>`;
    return;
  }
  $main.innerHTML = `<div class="card" style="max-width:520px;margin:auto;text-align:center">
    <h2 style="margin-bottom:4px">${esc(info.label)}</h2>
    <div class="muted small">When the scan starts, hold this up to the camera.</div>
    <img id="pass-img" alt="Your pass" src="api/pass.png?t=${Date.now()}${passInverted() ? "&invert=1" : ""}"
      style="width:100%;max-width:440px;margin:14px auto;display:block;background:${passInverted() ? "#000" : "#fff"};border-radius:10px">
    <div class="small"><span id="pass-left"></span></div>
    <label class="inline small" style="margin-top:8px"><input type="checkbox" ${passInverted() ? "checked" : ""}
      onchange="setPassInverted(this.checked)"> Invert colours (white on black: may help if the screen glares on camera)</label>
    <div class="hint" style="margin-top:8px">Screen brightness medium-high works best; tilt the phone away from lights.
      The code changes every ${info.period} s and each one works once.</div>
    <div class="hint" id="pass-shortcut" style="margin-top:8px"></div></div>`;
  showShortcut();
  let left = info.seconds_left;
  const show = () => { const el = document.getElementById("pass-left"); if (el) el.textContent = `New code in ${Math.max(0, Math.ceil(left))} s`; };
  show();
  passTick = setInterval(() => { left -= 1; show(); }, 1000);
  passTimer = setTimeout(() => passPage(w), (left + 0.4) * 1000);
}
// A dashboard button (tap action: Navigate) to this path opens the pass directly.
function showShortcut() {
  const el = document.getElementById("pass-shortcut");
  if (el && haBase) el.innerHTML = `Shortcut: a dashboard button with the tap action <i>Navigate</i> to
    <code>${esc(haBase)}/pass</code> opens this page directly.`;
}

// ---------- navigation ----------------------------------------------------
// One markup: a sidebar on wide screens, a tab bar on phones (CSS only).
function section(h) {
  if (h.startsWith("/access")) return "access";
  if (h === "/settings") return "settings";
  if (h === "/health") return "health";
  if (h === "/pass") return "pass";
  return "presence";
}
function renderNav() {
  const h = location.hash.replace(/^#/, "") || "/";
  const sec = section(h), a = state.access || {};
  document.querySelectorAll("nav .tab").forEach(t => t.classList.toggle("active", t.dataset.sec === sec));
  document.getElementById("access-off").style.display = a.enabled ? "none" : "";
  const issues = state.objects.filter(o => o.alert || (o.state === "unknown" && o.settings.enabled && o.last_check)).length + (a.error ? 1 : 0);
  const hb = document.getElementById("health-badge");
  hb.textContent = issues; hb.style.display = issues ? "" : "none";
  const objId = (h.match(/^\/(?:obj|edit)\/([a-z0-9_]+)$/) || [])[1];
  document.getElementById("nav-objects").innerHTML = state.objects.map(o =>
    `<a href="#/obj/${o.id}" class="${o.id === objId ? "active" : ""}" title="${esc(o.state)}">
      <i class="dot ${esc(o.state)}"></i>${esc(o.name)}</a>`).join("");
  const scId = (h.match(/^\/access\/edit\/([a-z0-9_]+)$/) || [])[1];
  document.getElementById("nav-scanners").innerHTML = (a.scanners || []).map(sc =>
    `<a href="#/access/edit/${sc.id}" class="${sc.id === scId ? "active" : ""}">${esc(sc.name)}</a>`).join("");
}
async function refresh() {
  try { state = await api("state"); } catch (e) { return; }
  renderNav();
  document.getElementById("version").textContent = state.version ? "v" + state.version : "";
  render(true);
}
function schedule(ms = 3000) { clearInterval(timer); timer = setInterval(refresh, ms); }

// ---------- router --------------------------------------------------------
function route() { editorDirty = false; clearTimeout(passTimer); clearInterval(passTick); renderNav(); render(false); syncToHA(); }
window.addEventListener("hashchange", route);

// ---------- Home Assistant URL <-> page --------------------------------------
// Opened as a panel, Home Assistant tells us its route (home-assistant/properties),
// so /<panel>/pass or /<panel>/obj/bin opens that page directly, and we keep its
// address bar in step with ours (home-assistant/navigate) so links and Back work.
// Older frontends put the first part of our path in route.prefix, so both are joined
// and split again here.
let haBase = null, haPath = null;
function go(hash) {
  if (haBase) location.replace(hash);       // no extra iframe history entry: HA keeps the history
  else location.hash = hash;
}
function syncToHA() {
  if (!haBase) return;
  const h = location.hash.replace(/^#/, "") || "/";
  const path = haBase + (h === "/" ? "" : h);
  if (path === haPath) return;
  haPath = path;
  window.parent.postMessage({ type: "home-assistant/navigate", path }, "*");
}
if (window.parent !== window) {
  window.addEventListener("message", ev => {
    const d = ev.data;
    if (ev.source !== window.parent || !d || d.type !== "home-assistant/properties" || !d.route) return;
    const full = (d.route.prefix || "") + (d.route.path || "");
    const m = full.match(/^(\/app\/[^/]+|\/[^/]+)(\/.*)?$/);
    if (!m) return;
    const first = haBase === null;
    haBase = m[1]; haPath = full.replace(/\/$/, "");
    const tail = (m[2] || "").replace(/\/$/, "");
    const want = "#" + (tail || "/");
    if (tail && location.hash !== want) location.replace(want);   // HA's URL -> our page
    else if (!tail && first) syncToHA();                           // already on a page: show it in HA
    else if (!tail && (location.hash.replace(/^#/, "") || "/") !== "/") location.replace("#/");   // HA went back to the root
    showShortcut();
  });
  window.parent.postMessage({ type: "home-assistant/subscribe-properties" }, "*");
}
document.addEventListener("click", ev => {          // in-page links go through go()
  const a = ev.target.closest && ev.target.closest('a[href^="#/"]');
  if (!a || a.target || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button) return;
  ev.preventDefault();
  go(a.getAttribute("href"));
});

function render(isRefresh) {
  const h = location.hash.replace(/^#/, "") || "/";
  let m;
  if (h === "/") return overview();
  if (h === "/settings") return isRefresh ? null : settingsPage();
  if (h === "/health") return healthPage(isRefresh);
  if (h === "/new") return isRefresh ? null : objectForm(null);
  if ((m = h.match(/^\/edit\/([a-z0-9_]+)$/))) return isRefresh ? null : objectForm(m[1]);
  if ((m = h.match(/^\/obj\/([a-z0-9_]+)$/))) return detail(m[1], isRefresh);
  if (h === "/pass") return isRefresh ? null : passPage();
  if (h === "/access") return accessPage(isRefresh);
  if (h === "/access/new") return isRefresh ? null : scannerForm(null);
  if ((m = h.match(/^\/access\/edit\/([a-z0-9_]+)$/))) return isRefresh ? null : scannerForm(m[1]);
  go("#/");
}

// ---------- overview ------------------------------------------------------
const presenceBar = `<div class="toolbar"><h2>Presence</h2><a class="btn primary" href="#/new">Add object</a></div>`;
function overview() {
  if (!state.objects.length) {
    $main.innerHTML = `${presenceBar}<div class="card"><h2>No objects yet</h2>
      <p class="muted">TagSense Presence tells Home Assistant whether a tagged object (a bin, a car, a chair...) is in its
        usual place. Add the first thing to watch: give it a name, pick the tag ID printed on it and the camera that sees it.
        Moving from another TagSense install? Import its objects under <a href="#/settings">Settings → Backup</a>.</p>
      <a class="btn primary" href="#/new">Add object</a></div>`;
    return;
  }
  $main.innerHTML = `${presenceBar}<div class="grid">${state.objects.map(o => `
    <div class="card">
      <div class="row"><h2 style="flex:1"><a href="#/obj/${o.id}">${esc(o.name)}</a></h2>${chip(o.state, "")}</div>
      <div class="muted small">${esc(tagLabel(o))} · ${esc(o.source === "go2rtc" ? o.go2rtc_stream : o.camera_entity)} · ${esc(o.reason)}</div>
      ${o.alert ? `<div class="notice alert small" style="margin:10px 0 0">${esc(o.alert.message)}</div>` : ""}
      ${o.has_image ? `<img class="thumb" src="api/objects/${o.id}/last.jpg?t=${encodeURIComponent(o.last_check || "")}" alt="">`
                    : `<div class="thumb empty">no image yet</div>`}
      <div class="row"><span class="muted small" style="flex:1">checked ${ago(o.last_check)}${o.settings.enabled ? "" : " · disabled"}</span>
        <button onclick="checkNow('${o.id}', this)" ${o.settings.enabled ? "" : "disabled"}>Check now</button>
        <a class="btn" href="#/obj/${o.id}">Open</a></div>
    </div>`).join("")}</div>`;
}

// ---------- health ----------------------------------------------------------
// One page for "is everything working?": connections, cameras, each object's
// last 24 hours, access scanners, recent log lines and a debug bundle.
const pct = v => v === null || v === undefined ? "–" : v + "%";
const secs = v => v === null || v === undefined ? "never" : v < 90 ? Math.round(v) + " s ago" : ago(new Date(Date.now() - v * 1000).toISOString());
function healthProblems(h) {
  const p = [];
  if (!h.mqtt_connected) p.push("The MQTT connection is down: Home Assistant is not getting updates.");
  if (!h.go2rtc_configured && h.objects.length) p.push("go2rtc_url is not set: objects on go2rtc streams cannot be checked.");
  for (const c of h.cameras) if (c.last_error && (c.last_frame_age_s === null || c.last_frame_age_s > 600))
    p.push(`Camera ${c.name}: no frame recently (${c.last_error}).`);
  for (const o of h.objects) {
    if (o.alert) p.push(`${o.name}: ${o.alert}`);
    else if (o.enabled && o.state === "unknown" && o.last_check) p.push(`${o.name} is unknown: ${o.reason}.`);
    if (o.day.discard_pct >= 50) p.push(`${o.name}: ${o.day.discard_pct}% of frames discarded in 24 h. If they look fine, lower the smear threshold in Settings.`);
  }
  if (h.access && h.access.error) p.push(`Access did not start: ${h.access.error}`);
  if (h.access && h.access.scanners) {
    if (!h.access.mqtt_connected) p.push("The access MQTT connection is down.");
    for (const sc of h.access.scanners) if (sc.locked_until) p.push(`Scanner ${sc.name} is locked out after too many bad codes.`);
  }
  return p;
}

function globalsForm() {

function globalsDirty() {
  const f = globalsForm(), v = globalsData.values;

async function saveGlobals(e) {
  e.preventDefault();

  const body = Object.fromEntries(Object.entries(f).filter(([k, x]) => x !== v[k]));

    globalsData = await api("globals", { method: "PATCH", body });

async function importObjects() {
  const text = document.getElementById("t-import").value.trim(), err = document.getElementById("t-error");
  err.textContent = "";
  if (!text) return;
  if (!confirm("Import these objects? Objects with the same id are updated (their settings too); new ones are added.")) return;
  try {
    const r = await api("import", { method: "POST", body: { text } });
    const hist = Object.entries(r.history || {}).map(([id, h]) =>
      `${id}: ${h.checks_added} chart records${h.reference_taken ? ", learned position" : ""}`).join("; ");
    const sc = r.scanners || {};
    const scText = sc.skipped ? `\nScanners not imported: ${sc.skipped}.`
      : (sc.added || sc.updated) ? `\nScanners added: ${(sc.added || []).join(", ") || "none"}; updated: ${(sc.updated || []).join(", ") || "none"}.` : "";
    alert(`Imported. Added: ${r.added.join(", ") || "none"}. Updated: ${r.updated.join(", ") || "none"}.` +
      (hist ? `\nHistory merged: ${hist}.` : "") + scText + (r.globals_changed ? "\nDetection settings updated." : ""));
    document.getElementById("t-import").value = "";
    await refresh();
    settingsPage();
  } catch (e) { err.textContent = e.message; }
}

${notify(n + " is not in its usual place.")}`],
    ["Gone for a long time", `alias: ${q(n + ": gone for 12 hours")}
triggers:
  - trigger: state

// ---------- 24h chart -----------------------------------------------------
// Small multiples on one time axis (never two y-scales), in 10-minute buckets:
// hit rate (frames with the tag / frames fetched; early-exit checks fetch fewer
// frames, so raw hit counts would mislead), crop contrast, the worst tag aspect
// against max_aspect, the tag rotation (horizontal runs at each stepped value,
// no connecting lines: 270 -> 0 is a 90 deg turn, not a 270 deg jump) and the
// reported state.
const STATE_COLOR = { present: "var(--ok)", absent: "var(--muted)", unknown: "var(--warn)" };
const BUCKET_S = 600;
let chartPts = [];
function bucketise(pts, t0) {
  const n = 86400 / BUCKET_S, out = Array.from({ length: n }, () => null);
  for (const p of pts) {
    const i = Math.floor((p.t - t0) / BUCKET_S);
    if (i < 0 || i >= n) continue;
    const b = out[i] || (out[i] = { t: t0 + (i + 0.5) * BUCKET_S, i, checks: 0, hits: 0, frames: 0, cSum: 0, cN: 0,
                                     aspect: null, rotation: null, states: {}, outcomes: {} });
    b.checks++; b.hits += p.hits; b.frames += p.frames || 0;
    if (p.contrast !== null && p.contrast !== undefined) { b.cSum += p.contrast; b.cN++; }
    if (p.aspect) b.aspect = Math.max(b.aspect || 0, p.aspect);
    if (p.rotation !== null && p.rotation !== undefined) b.rotation = p.rotation;    // the latest
    b.states[p.reported] = (b.states[p.reported] || 0) + 1;
    b.outcomes[p.outcome] = (b.outcomes[p.outcome] || 0) + 1;
  }
  for (const b of out) if (b) {
    b.rate = b.frames ? 100 * b.hits / b.frames : null;
    b.contrast = b.cN ? b.cSum / b.cN : null;
    b.state = Object.entries(b.states).sort((x, y) => y[1] - x[1])[0][0];
  }
  return out;
}
function drawChart(pts) {
  const el = document.getElementById("chart");
  if (!el) return;
  chartPts = pts;
  document.getElementById("chart-key").innerHTML = pts.length
    ? Object.entries(STATE_COLOR).map(([k, c]) => `<span style="margin-left:10px"><i style="background:${c}"></i>${k}</span>`).join("") : "";
  if (!pts.length) { el.innerHTML = `<div class="muted small">No checks in the last 24 hours.</div>`; return; }
  const W = Math.max(280, el.clientWidth), L = 34, R = 8, iw = W - L - R;
  const t1 = Math.ceil(Date.now() / 1000 / BUCKET_S) * BUCKET_S, t0 = t1 - 86400;
  const x = t => L + (t - t0) / 86400 * iw, bw = iw / (86400 / BUCKET_S);
  const buckets = bucketise(pts, t0);
  const maxC = Math.max(10, ...buckets.map(b => b && b.contrast || 0));
  const lim = state.max_aspect || 0;
  const maxA = Math.max(lim ? lim * 1.15 : 2, ...buckets.map(b => b && b.aspect || 0));
  const panels = [
    { key: "rate", title: "Hit rate, % of frames with the tag", h: 56, max: 100, ticks: [0, 100], wash: true },
    { key: "contrast", title: "Crop contrast", h: 48, max: maxC, ticks: [0, Math.round(maxC)] },
    { key: "aspect", title: "Tag aspect, worst per 10 min" + (lim ? ` (orange line: limit ${lim})` : ""), h: 48, min: 1,
      max: maxA, ticks: [1, +maxA.toFixed(1)], limit: lim },
  ];
  const hasRot = buckets.some(b => b && b.rotation !== null);
  const maxR = Math.max(270, ...buckets.map(b => b && b.rotation || 0));
  if (hasRot) panels.push({ key: "rotation", title: "Rotation, degrees (latest per 10 min)", h: 64, max: maxR,
                            ticks: [0, 90, 180, 270], runs: true });
  const f = n => n.toFixed(1);
  const segments = key => {                 // runs of buckets with a value
    const segs = [];
    let cur = null;
    buckets.forEach((b, i) => {
      const v = b && b[key];
      if (v === null || v === undefined) { cur = null; return; }
      if (!cur) segs.push(cur = []);
      cur.push([x(b.t), v]);
    });
    return segs;
  };
  let y = 0, out = "";
  for (const pn of panels) {
    y += 16;
    const top = y, lo = pn.min || 0, yOf = v => top + pn.h - (Math.min(v, pn.max) - lo) / (pn.max - lo) * pn.h;
    out += `<text x="${L}" y="${top - 5}" style="fill:var(--text)">${esc(pn.title)}</text>`;
    for (const tk of pn.ticks) out += `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${yOf(tk)}" y2="${yOf(tk)}"/>
      <text x="${L - 6}" y="${yOf(tk) + 4}" text-anchor="end">${tk}</text>`;
    if (pn.limit) out += `<line class="limit" x1="${L}" x2="${W - R}" y1="${yOf(pn.limit)}" y2="${yOf(pn.limit)}"/>`;
    if (pn.runs) {                          // runs of equal values, no connectors
      let run = null;
      const flush = () => { if (run) out += `<path class="series" d="M${f(run.x0)} ${f(yOf(run.v))}H${f(run.x1)}"/>`; run = null; };
      buckets.forEach(b => {
        const v = b && b[pn.key];
        if (v === null || v === undefined) return flush();
        const x0 = x(b.t) - bw / 2 + 1, x1 = x(b.t) + bw / 2 - 1;
        if (run && run.v === v && run.i === b.i - 1) { run.x1 = x1; run.i = b.i; }
        else { flush(); run = { v, x0, x1: Math.max(x1, x0 + 3), i: b.i }; }
      });
      flush();
      y += pn.h + 8;
      continue;
    }
    for (const seg of segments(pn.key)) {
      if (seg.length === 1) seg.push([seg[0][0] + bw * 0.6, seg[0][1]]);   // lone bucket: a short dash
      const d = seg.map(([px, v], i) => `${i ? "L" : "M"}${f(px)} ${f(yOf(v))}`).join("");
      if (pn.wash) out += `<path class="wash" d="${d}L${f(seg[seg.length - 1][0])} ${f(yOf(lo))}L${f(seg[0][0])} ${f(yOf(lo))}Z"/>`;
      out += `<path class="series" d="${d}"/>`;
    }
    y += pn.h + 8;
  }
  y += 4;
  const bandY = y;
  for (const b of buckets) if (b)
    out += `<rect x="${f(x(b.t) - bw / 2)}" y="${bandY}" width="${f(bw + 0.5)}" height="8" style="fill:${STATE_COLOR[b.state] || "var(--line)"}"/>`;
  y += 8 + 16;
  for (let h = 0; h <= 24; h += 6) {
    const t = t0 + h * 3600, d = new Date(t * 1000);
    out += `<text x="${x(t)}" y="${y - 2}" text-anchor="${h === 0 ? "start" : h === 24 ? "end" : "middle"}">${h === 24 ? "now"
      : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</text>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${y}" height="${y}" role="img" aria-label="Checks over the last 24 hours">${out}
    <line class="cross" id="c-cross" x1="0" x2="0" y1="8" y2="${bandY + 8}" style="display:none"/></svg><div class="tip" id="c-tip"></div>`;
  const svg = el.querySelector("svg"), tip = document.getElementById("c-tip"), cross = document.getElementById("c-cross");
  const hm = t => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  svg.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const b = buckets[Math.floor((px - L) / bw)];
    if (!b) { tip.style.display = cross.style.display = "none"; return; }
    const bx = x(b.t);
    cross.setAttribute("x1", bx); cross.setAttribute("x2", bx); cross.style.display = "";
    tip.innerHTML = `<b>${hm(b.t - BUCKET_S / 2)}–${hm(b.t + BUCKET_S / 2)}</b> · ${b.checks} check${b.checks === 1 ? "" : "s"}<br>
      ${Object.entries(b.states).map(([k, n]) => `${esc(k)} ${n}`).join(", ")}
      (${Object.entries(b.outcomes).map(([k, n]) => `${esc(k)} ${n}`).join(", ")})<br>
      hit rate ${fmtNum(b.rate, 0)} % · contrast ${fmtNum(b.contrast)} · worst aspect ${fmtNum(b.aspect, 2)}${b.rotation !== null ? ` · rotation ${b.rotation}°` : ""}`;
    tip.style.display = "block";
    const left = bx * r.width / W;
    tip.style.left = Math.min(Math.max(0, left + 12), r.width - tip.offsetWidth) + "px";
    tip.style.top = "8px";
  });
  svg.addEventListener("pointerleave", () => { tip.style.display = cross.style.display = "none"; });
}
window.addEventListener("resize", () => { if (chartPts.length) drawChart(chartPts); });

// ---------- crop editor ---------------------------------------------------
// One editor, used by the object page and the access scanner page. The page sets
// editorCtx: { saved() -> [x1,y1,x2,y2], frameUrl(fresh), save(crop) (async), overlay() }.
let crop = [0, 0, 1, 1];
let editorCtx = null;
const savedCrop = () => editorCtx ? editorCtx.saved() : [0, 0, 1, 1];
function objectEditor(id) {
  return {
    saved: () => { const s = objById(id)?.settings || {};
      return [s.crop_x1, s.crop_y1, s.crop_x2, s.crop_y2].map(Number); },
    frameUrl: fresh => `api/objects/${id}/frame.jpg?max_age=${fresh ? 0 : 120}&t=${Date.now()}`,
    save: async ([x1, y1, x2, y2]) => {
      await api(`objects/${id}/settings`, { method: "PATCH",
        body: { crop_x1: x1, crop_y1: y1, crop_x2: x2, crop_y2: y2 } });

      await refresh();
      checkNow(id, document.getElementById("d-check"));
    },
    overlay: () => { const o = objById(id); if (o) drawOverlay(o); },
  };

// The crop editor's markup. `extra` adds buttons (e.g. Fit to tag), `legend` legend entries.
function editorHtml(title, help, extra = "", legend = "") {
  return `<div class="row"><h3 style="flex:1;margin:0">${title}</h3>
      <button type="button" onclick="loadFrame(true)">Refresh frame</button>
      <button type="button" onclick="setCrop([0,0,1,1])">Whole frame</button>
      ${extra}
      <button type="button" onclick="setCrop(savedCrop())">Undo</button>

    <p class="muted small">Drag the box to move it, drag a corner to resize, or drag on the image to draw a new one.
      ${help}</p>
    <div class="editor" id="editor"><div class="loading" id="frame-loading">Fetching a frame…</div>
      <img id="frame" alt="" style="display:none">
      <svg id="overlay" viewBox="0 0 1 1" preserveAspectRatio="none">
        <path id="dim" fill="rgba(0,0,0,.6)" fill-rule="evenodd" d=""/><g id="marks"></g></svg>
      <div class="crop" id="crop" style="display:none">
        <div class="handle h-nw" data-h="nw"></div><div class="handle h-ne" data-h="ne"></div>
        <div class="handle h-sw" data-h="sw"></div><div class="handle h-se" data-h="se"></div></div>
    </div>
    <div class="legend small muted" style="margin-top:8px">
      <span><i style="background:var(--crop)"></i>${title.toLowerCase()}</span>${legend}
      <span id="crop-values"></span></div>
    <div class="error" id="crop-error"></div>`;
}
const clamp = v => Math.min(1, Math.max(0, v));

function setCrop(c, fromServer = false) {
  let [x1, y1, x2, y2] = c.map(clamp);
  if (x2 < x1) [x1, x2] = [x2, x1];
  if (y2 < y1) [y1, y2] = [y2, y1];
  crop = [x1, y1, x2, y2];
  const el = document.getElementById("crop");
  if (!el) return;
  Object.assign(el.style, { left: x1 * 100 + "%", top: y1 * 100 + "%",
    width: (x2 - x1) * 100 + "%", height: (y2 - y1) * 100 + "%" });
  const saved = savedCrop(), changed = crop.some((v, i) => Math.abs(v - saved[i]) > 0.004);
  editorDirty = !fromServer && changed;
  document.getElementById("dim").setAttribute("d",
    `M0 0H1V1H0Z M${x1} ${y1}V${y2}H${x2}V${y1}Z`);
  document.getElementById("crop-save").disabled = !changed;
  document.getElementById("crop-values").textContent = `x ${x1.toFixed(2)}–${x2.toFixed(2)} · y ${y1.toFixed(2)}–${y2.toFixed(2)}`;
}

function fitToTag() {
  const o = objById(currentId()), ref = o && o.reference, img = document.getElementById("frame");
  if (!ref || !ref.centre || !ref.size) return;
  const ratio = img.naturalWidth ? img.naturalHeight / img.naturalWidth : 9 / 16;
  const hy = 3 * ref.size, hx = hy * ratio, [cx, cy] = ref.centre;
  setCrop([cx - hx, cy - hy, cx + hx, cy + hy]);
}

function drawOverlay(o) {
  const svg = document.getElementById("marks");
  if (!svg) return;
  let out = "";
  if (o.last_corners) out += `<polygon points="${o.last_corners.map(p => p.join(",")).join(" ")}"
      fill="none" stroke="var(--quad)" stroke-width="0.004" vector-effect="non-scaling-stroke" style="stroke-width:2px"/>`;
  const c = o.reference && o.reference.centre;
  if (c) out += `<g stroke="var(--usual)" style="stroke-width:2px" vector-effect="non-scaling-stroke">
      <line x1="${c[0] - 0.02}" y1="${c[1]}" x2="${c[0] + 0.02}" y2="${c[1]}" vector-effect="non-scaling-stroke"/>
      <line x1="${c[0]}" y1="${c[1] - 0.035}" x2="${c[0]}" y2="${c[1] + 0.035}" vector-effect="non-scaling-stroke"/></g>`;
  const zero = o.rotation && o.rotation.zero_corners;     // on top of the crosshair
  if (zero) out += tagArrow(zero, "var(--usual)", true);
  if (o.last_corners) out += tagArrow(o.last_corners, "var(--quad)", false);
  svg.innerHTML = out;
}

// Arrow from the tag centre through the middle of its top edge (corners 0-1: the
// tag's own top). Drawn in square pixel space so the head is not stretched by
// the 0-1 overlay's non-uniform scaling.
function tagArrow(corners, color, dashed) {
  const img = document.getElementById("frame");
  const k = img && img.naturalWidth ? img.naturalHeight / img.naturalWidth : 9 / 16;
  const P = corners.map(([x, y]) => [x, y * k]);
  const cx = P.reduce((a, p) => a + p[0], 0) / 4, cy = P.reduce((a, p) => a + p[1], 0) / 4;
  const mx = (P[0][0] + P[1][0]) / 2, my = (P[0][1] + P[1][1]) / 2;
  let dx = mx - cx, dy = my - cy;
  const len = Math.hypot(dx, dy);
  if (!len) return "";
  dx /= len; dy /= len;
  const L = Math.max(len * 1.9, 0.045), hs = Math.max(len * 0.55, 0.012);   // past the crosshair
  const tx = cx + dx * L, ty = cy + dy * L;
  const back = [tx - dx * hs, ty - dy * hs];
  const pts = [[tx, ty], [back[0] - dy * hs * 0.55, back[1] + dx * hs * 0.55],
               [back[0] + dy * hs * 0.55, back[1] - dx * hs * 0.55]];
  const u = ([x, y]) => `${x.toFixed(5)},${(y / k).toFixed(5)}`;
  return `<g stroke="${color}" fill="${color}">
    <line x1="${cx}" y1="${cy / k}" x2="${back[0]}" y2="${back[1] / k}" vector-effect="non-scaling-stroke"
      style="stroke-width:2px" ${dashed ? 'stroke-dasharray="4 3"' : ""}/>
    <polygon points="${pts.map(u).join(" ")}" ${dashed ? 'fill-opacity="0.35"' : ""} stroke="none"/></g>`;
}

function loadFrame(fresh) {
  const img = document.getElementById("frame"), loading = document.getElementById("frame-loading");
  if (!img || !editorCtx) return;
  const ctx = editorCtx;
  loading.style.display = ""; loading.textContent = "Fetching a frame…";
  const next = new Image();
  next.onload = () => { img.src = next.src; img.style.display = ""; loading.style.display = "none";
    document.getElementById("crop").style.display = "";
    setCrop(crop, !editorDirty);
    if (ctx.overlay) ctx.overlay(); };
  next.onerror = () => { loading.textContent = "Could not fetch a frame from the camera. Check the app log."; };
  next.src = ctx.frameUrl(fresh);
}

function initEditor(o) {
  const ed = document.getElementById("editor");
  let drag = null;
  const pos = e => { const r = ed.getBoundingClientRect();
    return [clamp((e.clientX - r.left) / r.width), clamp((e.clientY - r.top) / r.height)]; };
  ed.addEventListener("pointerdown", e => {
    if (document.getElementById("frame").style.display === "none") return;
    const p = pos(e), h = e.target.dataset && e.target.dataset.h;
    if (h) drag = { mode: h, start: p, orig: crop.slice() };
    else if (e.target.id === "crop") drag = { mode: "move", start: p, orig: crop.slice() };
    else drag = { mode: "draw", start: p, orig: crop.slice() };
    ed.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  ed.addEventListener("pointermove", e => {
    if (!drag) return;
    const [x, y] = pos(e), [sx, sy] = drag.start, [x1, y1, x2, y2] = drag.orig;
    if (drag.mode === "move") {
      const dx = Math.min(Math.max(x - sx, -x1), 1 - x2), dy = Math.min(Math.max(y - sy, -y1), 1 - y2);
      setCrop([x1 + dx, y1 + dy, x2 + dx, y2 + dy]);
    } else if (drag.mode === "draw") setCrop([sx, sy, x, y]);
    else setCrop([drag.mode.includes("w") ? x : x1, drag.mode.includes("n") ? y : y1,
                  drag.mode.includes("e") ? x : x2, drag.mode.includes("s") ? y : y2]);
  });
  const end = () => {
    if (drag && (crop[2] - crop[0] < 0.02 || crop[3] - crop[1] < 0.02)) setCrop(drag.orig);  // a click, not a box
    drag = null;
  };
  ed.addEventListener("pointerup", end);
  ed.addEventListener("pointercancel", end);
}

async function saveCrop() {
  const err = document.getElementById("crop-error"), btn = document.getElementById("crop-save");

}

let access = null;
const EVENT_TEXT = {
  verified: "VERIFIED", invalid: "invalid code", not_yet_valid: "code not valid yet", expired: "expired code",
  replayed: "code already used", revoked: "revoked code", locked_out: "locked out (too many bad codes)",
  unrecognised: "not a TagSense code", unavailable: "could not verify (failed closed)",
  scan_timeout: "no valid code before the window ended" };
function eventDetail(e) {
  if (e.label) return `${e.label} · ${e.code_type}${e.uses_left !== null && e.uses_left !== undefined ? ` · ${e.uses_left} uses left` : ""}`;
  if (e.fingerprint) return `fingerprint ${e.fingerprint}`;
  if (e.locked_until) return `until ${new Date(e.locked_until).toLocaleTimeString()}`;
  if (e.event_type === "scan_timeout") return `${e.frames} frames${e.fetch_failures ? ", " + e.fetch_failures + " failed" : ""}`;
  return e.reason || "";
}

function scannerCard(sc) {

function scannerDynamic(sc) {
  const last = sc.events[0];
  const src = sc.source === "go2rtc" ? "go2rtc " + sc.go2rtc_stream : sc.camera_entity;
  const crop = [sc.crop_x1, sc.crop_y1, sc.crop_x2, sc.crop_y2];

    ${sc.locked_until ? `<div class="notice alert small" style="margin:8px 0 0">Locked out until ${esc(new Date(sc.locked_until).toLocaleString())} after too many bad codes: scans are ignored.

            <span class="muted">${esc(eventDetail(e))}</span>${e.test ? ` <span class="chip unknown">test</span>` : ""}</td></tr>`).join("")}</table>`
          : `<div class="muted small">None since the app started.</div>`}</div>

}
function statsText(st) {
  const parts = [st.capture === "stream" ? "video stream" : st.capture === "snapshot" ? "snapshots" : st.capture];
  if (st.first_frame_s !== undefined) parts.push(`first frame after ${st.first_frame_s} s`);
  parts.push(`${st.frames} frame${st.frames === 1 ? "" : "s"} checked` + (st.checked_per_s ? ` (${st.checked_per_s}/s)` : ""));
  if (st.fetch_ms) parts.push(`${(st.fetch_ms / 1000).toFixed(1)} s per snapshot`);
  if (st.resolution) parts.push(st.resolution);
  if (st.stream_error) parts.push(`stream error: ${st.stream_error}`);
  return parts.join(" · ");
}

const BLUEPRINT_IMPORT = "https://my.home-assistant.io/redirect/blueprint_import/?blueprint_url=" +
  encodeURIComponent("https://github.com/lsnewman/ha-tagsense/blob/main/blueprints/automation/tagsense/unlock_on_confirmed_code.yaml");
const haSlug = t => String(t).toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
let setupShown = null;          // null: open while anything is left to do
function setupSteps() {
  const a = access, act = a.activity || {}, sc = a.scanners[0], d = codesData;
  const button = sc ? `button.${haSlug("tagsense_access_" + sc.name + "_scan")}` : "the scanner's Scan button";
  const event = sc ? `event.${haSlug("tagsense_access_" + sc.name + "_code")}` : "the scanner's Code event";
  return [
    [a.mqtt_connected, "Access has its own MQTT login, connected",
      "Check access_mqtt_username / access_mqtt_password on the Configuration tab and the broker log."],
    [a.scanners.length > 0, "A camera is added as a scanner",
      `<a href="#/access/new">Add scanner</a>, then draw its scan area.`],
    [!!(d && (d.people.some(p => p.enabled) || d.static.some(r => r.status === "active"))), "There is a pass or a static code",
      "Add a pass for yourself (below), so you can test with your phone."],
    [!!act.test_ok, "<b>Test my setup</b> has read a code",
      "Press <b>Test my setup</b> on the scanner and hold a code up to the camera. Test events never unlock anything."
      + (act.test_ok ? "" : "")],
    [!!act.ha_scan, "An automation starts a scan",
      `In Home Assistant, add an automation that presses <code>${esc(button)}</code> when someone should show a code (for example on a doorbell press).`],
    [!!act.confirm, "Home Assistant confirms events before unlocking",
      `Add the <code>rest_command</code> from <i>Confirm events</i> below, then
      <a href="${BLUEPRINT_IMPORT}" target="_blank" rel="noopener">import the unlock blueprint</a> and pick <code>${esc(event)}</code>.

}
function renderSetup() {
  const box = document.getElementById("acc-setup");

  const act = access.activity || {};
  box.innerHTML = `<div class="card" style="margin-bottom:16px"><div class="row">
      <h3 style="flex:1;margin:0">Setup ${left ? `<span class="muted small">${steps.length - left} of ${steps.length} done</span>`
        : `<span class="chip present">complete</span>`}</h3>
      <button class="small" onclick="setupShown=${!open};renderSetup()">${open ? "Hide" : "Show"}</button></div>
    ${open ? `<ol class="setup">${steps.map(([ok, title, hint]) => `<li class="${ok ? "ok" : ""}">
        <span class="tick">${ok ? "✓" : ""}</span><div><div>${title}</div>${ok ? "" : `<div class="hint">${hint}</div>`}</div></li>`).join("")}</ol>
      <div class="hint">${act.ha_scan ? `Home Assistant last started a scan ${ago(act.ha_scan)}. ` : ""}${act.confirm ? `Last confirm ${ago(act.confirm)}. ` : ""}${act.test_ok ? `Last passed test ${ago(act.test_ok)}.` : ""}</div>` : ""}
  </div>`;
}

// ---------- access: Test my setup ------------------------------------------------
// A test scan's events are marked "test" and carry no confirmable id, so no
// automation can unlock on them. It can use your own pass, or a 1-use code that
// expires in 15 minutes (revoked when the test ends if it was not used).
const tests = {};               // scanner id -> { started, seen, code_id, done, pass }
const evKey = e => [e.scanned_at, e.event_type, e.fingerprint, e.code_id, e.label].join("|");
async function toggleTest(id) {
  if (tests[id]) { await endTest(id); delete tests[id]; document.getElementById("acc-test-" + id).innerHTML = ""; }
  else {
    tests[id] = { started: false, seen: new Set(), code_id: null, done: null, pass: null };
    try { tests[id].pass = (await api("pass")).has_pass; } catch (e) { tests[id].pass = false; }
  }
  refresh();
  const sc = scannerById(id); if (sc && tests[id]) drawTest(sc);
}
async function endTest(id) {
  const t = tests[id];
  if (t && t.code_id && !(t.done && t.done.event_type === "verified")) {
    try { await api(`access/static/${t.code_id}/revoke`, { method: "POST" }); } catch (e) { /* expires anyway */ }
    t.code_id = null; loadCodes();
  }
}
async function testCode(id) {
  try {
    const r = await api("access/static", { method: "POST", body: { label: "Setup test", uses: 1, expires: Date.now() / 1000 + 900 } });
    tests[id].code_id = r.code_id; loadCodes();
  } catch (e) { alert(e.message); }
  drawTest(scannerById(id));
}
async function testScan(id) {
  const t = tests[id];
  const sc = scannerById(id);            // results are the test events that appear after this
  t.seen = new Set((sc ? sc.events : []).map(evKey)); t.started = true; t.done = null;
  try { await api(`access/scanners/${id}/test`, { method: "POST" }); } catch (e) { alert(e.message); }
  setTimeout(refresh, 500);
  drawTest(scannerById(id));
}
const TEST_ADVICE = {
  verified: "TagSense read and checked the code. Your camera and scan area work. (A test never unlocks anything.)",
  scan_timeout: "Nothing readable in the window. Open the live frame: is the code inside the scan area, big enough, and not glaring? Try a brighter screen, or hold it closer.",
  unrecognised: "A QR code was read, but it is not a TagSense code. Show your pass or the test code.",
  invalid: "A TagSense code was read but did not check out (for example a code from another install, or after the signing key was rotated).",
  expired: "The code has expired: issue a new one.", replayed: "That code was already used: each code works once. Show a new one.",
  revoked: "That code was revoked.", not_yet_valid: "That code is not valid yet.",
  locked_out: "The scanner is locked out after too many bad codes: clear the lockout above and try again.",
  unavailable: "TagSense could not verify the code (it fails closed). See the app log.",
};
function drawTest(sc) {
  const box = sc && document.getElementById("acc-test-" + sc.id), t = sc && tests[sc.id];
  if (!box || !t) return;
  if (t.started && !t.done) {
    const fresh = sc.events.filter(e => e.test && !t.seen.has(evKey(e)));
    const ev = fresh.find(e => e.event_type !== "unrecognised") || (!sc.scanning && fresh[0]);
    if (ev) { t.done = ev; if (ev.event_type === "verified") t.code_id = null; loadCodes(); }   // uses left changed
  }
  const ok = t.done && t.done.event_type === "verified";
  const shortcut = haBase ? `<code>${esc(haBase)}/pass</code>` : "TagSense → My pass";
  box.innerHTML = `<div class="card testbox" style="margin-top:12px"><h3>Test my setup</h3>
    <ol>
      <li>Have a code ready on a phone: ${t.pass ? `open your pass (${shortcut})` : "you have no pass yet"}, or
        ${t.code_id ? `show this 1-use test code (it expires in 15 minutes):<br>
          <img alt="Test code" src="api/access/static/${t.code_id}.png" style="width:200px;max-width:100%;background:#fff;margin:8px 0;border-radius:6px">`
        : `<button class="small" onclick="testCode('${sc.id}')">Issue a 1-use test code</button> (open this page on the phone to show it).`}</li>
      <li>Press <button class="small primary" onclick="testScan('${sc.id}')" ${sc.scanning ? "disabled" : ""}>Start test scan</button>
        and hold the code up to the camera within ${sc.window_s} s.</li>
    </ol>
    ${t.started && !t.done ? `<div class="notice small">Scanning… ${sc.scanning ? "hold the code up to the camera now." : "waiting for the result."}</div>` : ""}
    ${t.done ? `<div class="notice ${ok ? "" : "alert"}" style="${ok ? "background:var(--chip-present)" : ""}">
      <b>${ok ? "✓ Verified" : esc(EVENT_TEXT[t.done.event_type] || t.done.event_type)}</b>${t.done.label ? `: ${esc(t.done.label)}` : ""}
      <div class="small">${esc(TEST_ADVICE[t.done.event_type] || "")}${sc.last_stats ? ` (${esc(statsText(sc.last_stats))})` : ""}</div></div>` : ""}
  </div>`;
}

function confirmCard() {

// Live frame: while a scan runs it reloads every second and shows the frame the

const scannerById = id => (access && access.scanners.find(s => s.id === id)) || null;
function liveBox(sc) {
  const [x1, y1, x2, y2] = [sc.crop_x1, sc.crop_y1, sc.crop_x2, sc.crop_y2].map(v => +v * 100);
  return `<div style="position:relative">
      <img id="live-img-${esc(sc.id)}" alt="Live frame" style="width:100%;border-radius:6px;display:block;min-height:60px;background:#000">
      <div style="position:absolute;left:${x1}%;top:${y1}%;width:${x2 - x1}%;height:${y2 - y1}%;border:2px solid #2ecc71;box-sizing:border-box;pointer-events:none"></div></div>
    <div class="row hint" style="margin-top:4px"><span id="live-note-${esc(sc.id)}" style="flex:1">Fetching a frame…</span>
      <button type="button" class="small" onclick="loadLive('${sc.id}')">Refresh</button></div>`;
}
function toggleLive(id) {
  const box = document.getElementById("acc-live-" + id), sc = scannerById(id);
  if (!box || !sc) return;
  if (liveOpen.has(id)) { liveOpen.delete(id); box.innerHTML = ""; }
  else { liveOpen.add(id); box.innerHTML = liveBox(sc); loadLive(id); }
  document.getElementById("acc-dyn-" + id).innerHTML = scannerDynamic(sc);
}
function loadLive(id) {
  const img = document.getElementById("live-img-" + id), note = document.getElementById("live-note-" + id);
  if (!img || liveBusy.has(id)) return;
  liveBusy.add(id);
  const next = new Image(), t0 = Date.now();
  next.onload = () => {
    liveBusy.delete(id);
    img.src = next.src;
    const sc = scannerById(id);
    if (note) note.textContent = (sc && sc.scanning ? "Live while scanning: the frame just checked" : "Snapshot")
      + ` · ${new Date().toLocaleTimeString()} · took ${((Date.now() - t0) / 1000).toFixed(1)} s · scan area in green, any readable code blacked out`;
  };
  next.onerror = () => { liveBusy.delete(id); if (note) note.textContent = "Could not fetch a frame from the camera."; };
  next.src = `api/access/scanners/${id}/frame.jpg?t=${Date.now()}`;
}

}, 1000);

      <label class="inline"><input type="checkbox" id="sf-fallback" ${v.fallback ? "checked" : ""}> If this camera fails, try the other source</label>
      ${o ? "" : `<div class="hint" style="margin-top:10px">After adding the scanner you can draw its scan area on a live frame.</div>`}
      <label for="sf-capture">Frame capture</label>
      <select id="sf-capture">
        ${o ? "" : `<option value="" selected>Best available (auto if both sources are set)</option>`}
        <option value="auto" ${v.capture === "auto" ? "selected" : ""}>Auto: snapshots from the Home Assistant camera until the go2rtc stream runs (needs both)</option>
        <option value="stream" ${v.capture === "stream" ? "selected" : ""}>Video stream (go2rtc)</option>
        <option value="snapshot" ${v.capture === "snapshot" ? "selected" : ""}>Single snapshots</option></select>
      <div class="hint">Video stream holds the go2rtc stream open during a scan: one start-up delay, then several frames a second.
        Single snapshots fetch one image at a time, which can take seconds each on some cameras. Home Assistant cameras always use snapshots.</div>
      <div class="row">${num("window_s", "Scan window (s)", 5, 120, 1)}${num("frame_interval_s", "Pause between snapshots (s)", 0, 5, 0.1)}</div>
      <label class="inline"><input type="checkbox" id="sf-debug" ${v.debug_frames ? "checked" : ""}> Keep raw scan frames for testing (last 50, deleted after 24 h)</label>
      <div class="hint">Raw frames can contain readable codes: leave this off except while testing.</div>
      <div id="sf-error" class="notice alert" style="white-space:pre-wrap;display:none;margin-top:10px"></div>
      <div class="row" style="margin-top:14px"><button class="primary" type="submit">${o ? "Save" : "Add"}</button>
        <a class="btn" href="#/access">Cancel</a>
        ${o ? `<span class="spacer"></span><button type="button" class="danger" onclick="deleteScanner('${o.id}')">Delete</button>` : ""}</div>
    </form></div>
    ${o ? `<div class="card" style="order:-1">${editorHtml("Scan area",
      "Cover where someone holds up a phone. A tighter area is faster; a code must be about 100 px across in the full frame to read. Any readable code in the frame is blacked out here.")}</div>` : ""}
    </div>`;
  if (o) {
    editorCtx = scannerEditor(o.id);
    editorDirty = false;
    setCrop(savedCrop(), true);
    initEditor(o);
    loadFrame(true);
  }
  api("sources").then(src => {
    document.getElementById("sf-streams").innerHTML = src.go2rtc.map(s => `<option value="${esc(s)}">`).join("");
    document.getElementById("sf-entities").innerHTML = src.ha_cameras.map(c => `<option value="${esc(c.entity_id)}">${esc(c.name)}</option>`).join("");
  }).catch(() => {});
  document.getElementById("sf").addEventListener("submit", async e => {
    e.preventDefault();
    const val = k => document.getElementById("sf-" + k).value;
    const body = { name: val("name").trim(), source: document.querySelector("input[name=sf-src]:checked").value,
      go2rtc_stream: val("stream").trim(), camera_entity: val("entity").trim(),
      fallback: document.getElementById("sf-fallback").checked, debug_frames: document.getElementById("sf-debug").checked,
      capture: val("capture") };
    for (const k of ["window_s", "frame_interval_s"]) body[k] = +val(k);
    if (!o) body.id = val("id").trim();
    try {
      const r = await (o ? api(`access/scanners/${o.id}`, { method: "PUT", body }) : api("access/scanners", { method: "POST", body }));
      access = null; go(o ? "#/access" : `#/access/edit/${r.id}`);
    } catch (err) {
      const box = document.getElementById("sf-error"); box.textContent = err.message; box.style.display = "";
    }
  });
}
function scannerEditor(id) {
  const cur = () => (access && access.scanners.find(s => s.id === id)) || {};
  return {
    saved: () => { const s = cur(); return [s.crop_x1, s.crop_y1, s.crop_x2, s.crop_y2].map(Number); },
    frameUrl: () => `api/access/scanners/${id}/frame.jpg?t=${Date.now()}`,
    save: async ([x1, y1, x2, y2]) => {
      await api(`access/scanners/${id}`, { method: "PUT", body: { crop_x1: x1, crop_y1: y1, crop_x2: x2, crop_y2: y2 } });
      editorDirty = false;
      access = await api("access");
      setCrop(savedCrop(), true);
    },
  };
}
async function deleteScanner(id) {
  if (!confirm("Delete this scanner and its Home Assistant entities?")) return;
  try { await api(`access/scanners/${id}`, { method: "DELETE" }); access = null; go("#/access"); }
  catch (e) { alert(e.message); }
}

(async () => {
  const w = await showWhoami();
  if (!w || !w.admin) {                 // non-admins (or unknown): their pass, nothing else
    document.body.classList.add("solo");
    window.removeEventListener("hashchange", route);
    return passPage(w);
  }
  try { state = await api("state"); } catch (e) { $main.innerHTML = `<div class="loading">Could not reach TagSense: ${esc(e.message)}</div>`; }
  document.getElementById("version").textContent = state.version ? "v" + state.version : "";
  renderNav();
  render(false);
  schedule();
})();
</script>
</body>
</html>
