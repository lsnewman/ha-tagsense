<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TagSense</title>
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --text: #1c1f23; --muted: #66707a; --line: #dde1e6;
  --accent: #0b74c4; --accent-text: #ffffff; --ok: #2e7d32; --warn: #b26a00; --bad: #c62828;
  --chip-present: #e3f3e4; --chip-absent: #eceff1; --chip-unknown: #fff1d6;
  --crop: #ffb300; --usual: #00b8d4; --quad: #43a047;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --card: #1b1f24; --text: #e6e8eb; --muted: #9aa4ae; --line: #2c333a;
    --accent: #4aa3e8; --accent-text: #0b1117; --ok: #66bb6a; --warn: #ffb74d; --bad: #ef5350;
    --chip-present: #1d3a22; --chip-absent: #262c33; --chip-unknown: #3d3016;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
  border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 18px; margin: 0; font-weight: 600; }
header .spacer { flex: 1; }
main { max-width: 1100px; margin: 0 auto; padding: 20px; }
a { color: var(--accent); text-decoration: none; }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
  padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.card h2 { font-size: 16px; margin: 0 0 4px; }
.card h3 { font-size: 14px; margin: 0 0 10px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; }
.chip.present { background: var(--chip-present); color: var(--ok); }
.chip.absent { background: var(--chip-absent); color: var(--muted); }
.chip.unknown { background: var(--chip-unknown); color: var(--warn); }
.thumb { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #000; border-radius: 6px;
  margin: 10px 0; display: block; }
.thumb.empty { display: flex; align-items: center; justify-content: center; color: #999; }
.card, .cols > * { min-width: 0; }
.card { overflow-wrap: anywhere; }
table { table-layout: fixed; }
.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 800px) { .cols { grid-template-columns: 1fr; } main { padding: 12px; }
  header { padding: 10px 12px; } .card { padding: 12px; } }
.stack > * + * { margin-top: 16px; }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
.kv td:first-child { color: var(--muted); white-space: nowrap; width: 40%; }
label { display: block; margin: 10px 0 4px; font-weight: 600; }
input, select { font: inherit; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--text); }
input[type=checkbox], input[type=radio] { width: auto; margin: 0 4px 0 0; vertical-align: -1px; }
label.inline { display: inline-flex; align-items: center; margin: 0 16px 0 0; font-weight: 400; }
.hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
.error { color: var(--bad); margin: 8px 0; white-space: pre-wrap; }
.notice { background: var(--chip-unknown); color: var(--text); padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; }

/* crop editor */
.editor { position: relative; user-select: none; touch-action: none; background: #000; border-radius: 6px;
  overflow: hidden; line-height: 0; }
.editor img { width: 100%; display: block; }
.editor svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.crop { position: absolute; border: 2px solid var(--crop); cursor: move; }
.handle { position: absolute; width: 14px; height: 14px; background: var(--crop); border: 2px solid #000;
  border-radius: 3px; }
.h-nw { left: -8px; top: -8px; cursor: nwse-resize; } .h-ne { right: -8px; top: -8px; cursor: nesw-resize; }
.h-sw { left: -8px; bottom: -8px; cursor: nesw-resize; } .h-se { right: -8px; bottom: -8px; cursor: nwse-resize; }
.legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; }
.legend i { width: 12px; height: 12px; display: inline-block; border-radius: 2px; }
.loading { padding: 40px; text-align: center; color: #aaa; line-height: 1.4; }
</style>
</head>
<body>
<header>
  <h1><a href="#/" style="color:inherit">TagSense</a></h1>
  <span class="muted small" id="version"></span>
  <span class="spacer"></span>
  <a class="btn" href="#/new">Add object</a>
</header>
<main id="main"><div class="loading">Loading…</div></main>

<script>
"use strict";
const $main = document.getElementById("main");
let state = { objects: [] };
let timer = null;
let editorDirty = false;

// ---------- helpers -------------------------------------------------------
async function api(path, opts = {}) {
  const init = { method: opts.method || "GET", headers: {} };
  if (opts.body !== undefined) {
    init.body = JSON.stringify(opts.body);
    init.headers["Content-Type"] = "application/json";
  }
  const r = await fetch("api/" + path, init);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ago(iso) {
  if (!iso) return "never";
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 5) return "just now";
  if (s < 90) return s + " s ago";
  if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 129600) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}
const chip = (st, reason) => `<span class="chip ${esc(st)}">${esc(st)}</span>
  <span class="muted small">${esc(reason || "")}</span>`;
const objById = id => state.objects.find(o => o.id === id);
function fmtNum(v, d = 1) { return v === null || v === undefined ? "–" : (typeof v === "number" ? v.toFixed(d) : esc(v)); }

async function refresh() {
  try { state = await api("state"); } catch (e) { return; }
  document.getElementById("version").textContent = state.version ? "v" + state.version : "";
  render(true);
}
function schedule(ms = 3000) { clearInterval(timer); timer = setInterval(refresh, ms); }

// ---------- router --------------------------------------------------------
function route() { editorDirty = false; render(false); }
window.addEventListener("hashchange", route);

function render(isRefresh) {
  const h = location.hash.replace(/^#/, "") || "/";
  let m;
  if (h === "/") return overview();
  if (h === "/new") return isRefresh ? null : objectForm(null);
  if ((m = h.match(/^\/edit\/([a-z0-9_]+)$/))) return isRefresh ? null : objectForm(m[1]);
  if ((m = h.match(/^\/obj\/([a-z0-9_]+)$/))) return detail(m[1], isRefresh);
  location.hash = "#/";
}

// ---------- overview ------------------------------------------------------
function overview() {
  if (!state.objects.length) {
    $main.innerHTML = `<div class="card"><h2>No objects yet</h2>
      <p class="muted">Add the first thing to watch: give it a name, pick the tag ID printed on it and the camera that sees it.</p>
      <a class="btn" href="#/new">Add object</a></div>`;
    return;
  }
  $main.innerHTML = `<div class="grid">${state.objects.map(o => `
    <div class="card">
      <div class="row"><h2 style="flex:1"><a href="#/obj/${o.id}">${esc(o.name)}</a></h2>${chip(o.state, "")}</div>
      <div class="muted small">tag ${o.tag_id} · ${esc(o.source === "go2rtc" ? o.go2rtc_stream : o.camera_entity)} · ${esc(o.reason)}</div>
      ${o.has_image ? `<img class="thumb" src="api/objects/${o.id}/last.jpg?t=${encodeURIComponent(o.last_check || "")}" alt="">`
                    : `<div class="thumb empty">no image yet</div>`}
      <div class="row"><span class="muted small" style="flex:1">checked ${ago(o.last_check)}${o.settings.enabled ? "" : " · disabled"}</span>
        <button onclick="checkNow('${o.id}', this)" ${o.settings.enabled ? "" : "disabled"}>Check now</button>
        <a class="btn" href="#/obj/${o.id}">Open</a></div>
    </div>`).join("")}</div>`;
}
async function checkNow(id, btn) {
  if (btn) { btn.disabled = true; btn.textContent = "Checking…"; }
  try { await api(`objects/${id}/check`, { method: "POST" }); } catch (e) { alert(e.message); }
  setTimeout(refresh, 1500);
}

// ---------- detail --------------------------------------------------------
function detail(id, isRefresh) {
  const o = objById(id);
  if (!o) { if (!isRefresh) $main.innerHTML = `<div class="loading">Loading…</div>`; return; }
  if (isRefresh && document.getElementById("detail-" + id)) return updateDetail(o);
  const s = o.settings;
  $main.innerHTML = `<div id="detail-${id}" class="stack">
    <div class="card"><div class="row">
      <h2 style="flex:1">${esc(o.name)} <span class="muted small">(${esc(o.id)})</span></h2>
      <span id="d-chip"></span>
      <button class="primary" id="d-check" onclick="checkNow('${id}', this)">Check now</button>
      <a class="btn" href="#/edit/${id}">Edit</a>
      <a class="btn" href="api/tag/${o.tag_id}.png" target="_blank" title="Print at a size where the black square is as large as the object allows">Print tag ${o.tag_id}</a>
    </div>
    <div class="muted small" id="d-sub"></div></div>

    <div class="cols">
      <div class="card">
        <div class="row"><h3 style="flex:1;margin:0">Search area</h3>
          <button onclick="loadFrame(true)">Refresh frame</button>
          <button onclick="setCrop([0,0,1,1])">Whole frame</button>
          <button onclick="setCrop(savedCrop())">Undo</button>
          <button class="primary" id="crop-save" onclick="saveCrop()" disabled>Save</button></div>
        <p class="muted small">Drag the box to move it, drag a corner to resize, or drag on the image to draw a new one.
          It must cover every spot where the object might be.</p>
        <div class="editor" id="editor"><div class="loading" id="frame-loading">Fetching a frame…</div>
          <img id="frame" alt="" style="display:none">
          <svg id="overlay" viewBox="0 0 1 1" preserveAspectRatio="none">
            <path id="dim" fill="rgba(0,0,0,.6)" fill-rule="evenodd" d=""/><g id="marks"></g></svg>
          <div class="crop" id="crop" style="display:none">
            <div class="handle h-nw" data-h="nw"></div><div class="handle h-ne" data-h="ne"></div>
            <div class="handle h-sw" data-h="sw"></div><div class="handle h-se" data-h="se"></div></div>
        </div>
        <div class="legend small muted" style="margin-top:8px">
          <span><i style="background:var(--crop)"></i>search area</span>
          <span><i style="background:var(--quad)"></i>last detection</span>
          <span><i style="background:var(--usual)"></i>usual position (learned)</span>
          <span id="crop-values"></span></div>
        <div class="error" id="crop-error"></div>
      </div>

      <div class="stack">
        <div class="card"><h3>Last check</h3><div id="d-last"></div></div>
        <div class="card"><h3>Settings</h3>
          <label><input type="checkbox" id="s-enabled" ${s.enabled ? "checked" : ""}
            onchange="saveSetting('enabled', this.checked)"> Enabled</label>
          <label for="s-poll">Poll interval (seconds)</label>
          <input id="s-poll" type="number" min="0" max="86400" value="${s.poll_interval}"
            onchange="saveSetting('poll_interval', this.value)">
          <div class="hint">0 = only when Check now is pressed. Otherwise at least 10.</div>
          <div class="error" id="s-error"></div></div>
      </div>
    </div>

    <div class="cols">
      <div class="card"><h3>Recent checks</h3><div id="d-history" class="small"></div></div>
      <div class="stack">
        <div class="card"><h3>Diagnostics</h3><div id="d-diag" class="small"></div></div>
        <div class="card" id="d-phantom-card" style="display:none"><h3>Last phantom read</h3><div id="d-phantom"></div></div>
      </div>
    </div>
    <div class="card"><div class="row"><span class="muted small" style="flex:1">Deleting removes this object, its entities and its saved state.</span>
      <button class="danger" onclick="deleteObject('${id}')">Delete ${esc(o.name)}</button></div></div>
  </div>`;
  initEditor(o);
  updateDetail(o);
  loadFrame(false);
}

let lastHistoryKey = "";
async function updateDetail(o) {
  document.getElementById("d-chip").innerHTML = chip(o.state, o.reason);
  document.getElementById("d-sub").textContent =
    `tag ${o.tag_id} · ${o.source === "go2rtc" ? "go2rtc " + o.go2rtc_stream : o.camera_entity} · checked ${ago(o.last_check)} · last seen ${ago(o.last_seen)}`;
  document.getElementById("d-check").disabled = !o.settings.enabled;
  const d = o.diag || {};
  document.getElementById("d-last").innerHTML = (o.has_image
      ? `<img class="thumb" style="margin-top:0" src="api/objects/${o.id}/last.jpg?t=${encodeURIComponent(o.last_check || "")}" alt="">` : "")
    + `<table class="kv small">
      <tr><td>Warning</td><td>${esc(d.warning || "none")}</td></tr>
      <tr><td>Tag size</td><td>${fmtNum(d.tag_size_px)} px</td></tr>
      <tr><td>Miss streak</td><td>${o.miss_streak}</td></tr></table>`;
  document.getElementById("d-diag").innerHTML = `<table class="kv">
    <tr><td>Source</td><td>${esc(d.last_source || "–")} ${esc(d.resolution || "")}</td></tr>
    <tr><td>Fetch / detect</td><td>${fmtNum(d.fetch_ms, 0)} ms / ${fmtNum(d.detect_ms, 0)} ms</td></tr>
    <tr><td>Discard rate</td><td>${fmtNum(d.discard_rate, 0)} %</td></tr>
    <tr><td>Unique frames</td><td>${d.unique_frames ?? "–"}</td></tr>
    <tr><td>Sanity ratio</td><td>${fmtNum(d.sanity_ratio, 2)}</td></tr>
    <tr><td>Crop brightness / contrast</td><td>${fmtNum(d.crop_mean)} / ${fmtNum(d.crop_std)}</td></tr>
    <tr><td>Fetch failures</td><td>${d.fetch_failures ?? "–"}</td></tr>
    <tr><td>Last error</td><td>${esc(d.last_error || "none")}</td></tr>
    <tr><td>Learned position</td><td>${o.reference.learned_hits} hit${o.reference.learned_hits === 1 ? "" : "s"}${o.reference.warnings_active ? "" : " (warnings start at 10)"}</td></tr></table>`;
  const ph = document.getElementById("d-phantom-card");
  ph.style.display = o.last_phantom ? "" : "none";
  if (o.last_phantom) document.getElementById("d-phantom").innerHTML =
    `<div class="small">${esc(o.last_phantom.detail)}<br><span class="muted">${ago(o.last_phantom.at)}</span></div>` +
    (o.has_phantom_image ? `<img class="thumb" src="api/objects/${o.id}/phantom.jpg?t=${encodeURIComponent(o.last_phantom.at)}" alt="">` : "");
  if (!editorDirty) { setCrop(savedCrop(), true); drawOverlay(o); }
  const s = o.settings, el = document.getElementById("s-enabled"), poll = document.getElementById("s-poll");
  if (document.activeElement !== poll) poll.value = s.poll_interval;
  el.checked = s.enabled;
  if (lastHistoryKey !== o.last_check) {
    lastHistoryKey = o.last_check;
    try {
      const hist = await api(`objects/${o.id}/history`);
      document.getElementById("d-history").innerHTML = hist.length ? `<table><tr><th>When</th><th>Trigger</th><th>Result</th><th>Hits</th><th>Reported</th></tr>
        ${hist.map(h => `<tr><td title="${esc(h.at)}">${ago(h.at)}</td><td>${esc(h.trigger)}</td><td>${esc(h.outcome)}</td>
          <td>${h.hits}/${h.valid}/${h.frames}</td><td>${esc(h.reported)} <span class="muted">${esc(h.reason)}</span>
          ${h.warning ? `<div style="color:var(--warn)">${esc(h.warning)}</div>` : ""}
          ${h.phantoms.length ? `<div class="muted">${h.phantoms.map(esc).join("<br>")}</div>` : ""}</td></tr>`).join("")}</table>
        <div class="hint">Hits = frames with the tag / usable frames / frames fetched. Kept in memory: the last 50 checks since the app started.</div>`
        : `<span class="muted">No checks since the app started.</span>`;
    } catch (e) { /* ignore */ }
  }
}

async function saveSetting(key, value) {
  const id = currentId(), err = document.getElementById("s-error");
  err.textContent = "";
  try { await api(`objects/${id}/settings`, { method: "PATCH", body: { [key]: value } }); refresh(); }
  catch (e) { err.textContent = e.message; }
}
async function deleteObject(id) {
  const o = objById(id);
  if (!confirm(`Delete ${o ? o.name : id}? Its Home Assistant entities and saved state are removed. This cannot be undone.`)) return;
  try { await api(`objects/${id}`, { method: "DELETE" }); location.hash = "#/"; refresh(); }
  catch (e) { alert(e.message); }
}
const currentId = () => (location.hash.match(/^#\/obj\/([a-z0-9_]+)$/) || [])[1];

// ---------- crop editor ---------------------------------------------------
let crop = [0, 0, 1, 1];
const savedCrop = () => { const s = objById(currentId())?.settings || {};
  return [s.crop_x1, s.crop_y1, s.crop_x2, s.crop_y2].map(Number); };
const clamp = v => Math.min(1, Math.max(0, v));

function setCrop(c, fromServer = false) {
  let [x1, y1, x2, y2] = c.map(clamp);
  if (x2 < x1) [x1, x2] = [x2, x1];
  if (y2 < y1) [y1, y2] = [y2, y1];
  crop = [x1, y1, x2, y2];
  const el = document.getElementById("crop");
  if (!el) return;
  Object.assign(el.style, { left: x1 * 100 + "%", top: y1 * 100 + "%",
    width: (x2 - x1) * 100 + "%", height: (y2 - y1) * 100 + "%" });
  const saved = savedCrop(), changed = crop.some((v, i) => Math.abs(v - saved[i]) > 0.004);
  editorDirty = !fromServer && changed;
  document.getElementById("dim").setAttribute("d",
    `M0 0H1V1H0Z M${x1} ${y1}V${y2}H${x2}V${y1}Z`);
  document.getElementById("crop-save").disabled = !changed;
  document.getElementById("crop-values").textContent = `x ${x1.toFixed(2)}–${x2.toFixed(2)} · y ${y1.toFixed(2)}–${y2.toFixed(2)}`;
}

function drawOverlay(o) {
  const svg = document.getElementById("marks");
  if (!svg) return;
  let out = "";
  if (o.last_corners) out += `<polygon points="${o.last_corners.map(p => p.join(",")).join(" ")}"
      fill="none" stroke="var(--quad)" stroke-width="0.004" vector-effect="non-scaling-stroke" style="stroke-width:2px"/>`;
  const c = o.reference && o.reference.centre;
  if (c) out += `<g stroke="var(--usual)" style="stroke-width:2px" vector-effect="non-scaling-stroke">
      <line x1="${c[0] - 0.02}" y1="${c[1]}" x2="${c[0] + 0.02}" y2="${c[1]}" vector-effect="non-scaling-stroke"/>
      <line x1="${c[0]}" y1="${c[1] - 0.035}" x2="${c[0]}" y2="${c[1] + 0.035}" vector-effect="non-scaling-stroke"/></g>`;
  svg.innerHTML = out;
}

function loadFrame(fresh) {
  const id = currentId(), img = document.getElementById("frame"), loading = document.getElementById("frame-loading");
  if (!img) return;
  loading.style.display = ""; loading.textContent = "Fetching a frame…";
  const next = new Image();
  next.onload = () => { img.src = next.src; img.style.display = ""; loading.style.display = "none";
    document.getElementById("crop").style.display = ""; };
  next.onerror = () => { loading.textContent = "Could not fetch a frame from the camera. Check the app log."; };
  next.src = `api/objects/${id}/frame.jpg?max_age=${fresh ? 0 : 120}&t=${Date.now()}`;
}

function initEditor(o) {
  const ed = document.getElementById("editor");
  let drag = null;
  const pos = e => { const r = ed.getBoundingClientRect();
    return [clamp((e.clientX - r.left) / r.width), clamp((e.clientY - r.top) / r.height)]; };
  ed.addEventListener("pointerdown", e => {
    if (document.getElementById("frame").style.display === "none") return;
    const p = pos(e), h = e.target.dataset && e.target.dataset.h;
    if (h) drag = { mode: h, start: p, orig: crop.slice() };
    else if (e.target.id === "crop") drag = { mode: "move", start: p, orig: crop.slice() };
    else drag = { mode: "draw", start: p, orig: crop.slice() };
    ed.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  ed.addEventListener("pointermove", e => {
    if (!drag) return;
    const [x, y] = pos(e), [sx, sy] = drag.start, [x1, y1, x2, y2] = drag.orig;
    if (drag.mode === "move") {
      const dx = Math.min(Math.max(x - sx, -x1), 1 - x2), dy = Math.min(Math.max(y - sy, -y1), 1 - y2);
      setCrop([x1 + dx, y1 + dy, x2 + dx, y2 + dy]);
    } else if (drag.mode === "draw") setCrop([sx, sy, x, y]);
    else setCrop([drag.mode.includes("w") ? x : x1, drag.mode.includes("n") ? y : y1,
                  drag.mode.includes("e") ? x : x2, drag.mode.includes("s") ? y : y2]);
  });
  const end = () => {
    if (drag && (crop[2] - crop[0] < 0.02 || crop[3] - crop[1] < 0.02)) setCrop(drag.orig);  // a click, not a box
    drag = null;
  };
  ed.addEventListener("pointerup", end);
  ed.addEventListener("pointercancel", end);
}

async function saveCrop() {
  const id = currentId(), err = document.getElementById("crop-error"), btn = document.getElementById("crop-save");
  err.textContent = ""; btn.disabled = true;
  const r = v => Math.round(v * 100) / 100;
  const [x1, y1, x2, y2] = crop.map(r);
  try {
    await api(`objects/${id}/settings`, { method: "PATCH",
      body: { crop_x1: x1, crop_y1: y1, crop_x2: x2, crop_y2: y2 } });
    editorDirty = false;
    await refresh();
    checkNow(id, document.getElementById("d-check"));
  } catch (e) { err.textContent = e.message; btn.disabled = false; }
}

// ---------- add / edit form -----------------------------------------------
async function objectForm(id) {
  const o = id ? objById(id) : null;
  if (id && !o) { $main.innerHTML = `<div class="loading">Loading…</div>`; await refresh(); if (!objById(id)) return; return objectForm(id); }
  const v = o || { name: "", tag_id: 5, source: "go2rtc", go2rtc_stream: "", camera_entity: "" };
  $main.innerHTML = `<div class="card" style="max-width:560px">
    <h2>${o ? "Edit " + esc(o.name) : "Add object"}</h2>
    ${!state.go2rtc_configured ? `<div class="notice small">go2rtc_url is not set in the app's Configuration tab, so only Home Assistant cameras can be used.</div>` : ""}
    <form id="f" autocomplete="off">
      <label for="f-name">Name</label>
      <input id="f-name" required maxlength="60" value="${esc(v.name)}" placeholder="Bin">
      <div class="hint">Names the device in Home Assistant, e.g. "TagSense Bin".</div>
      ${o ? `<div class="hint">ID: <b>${esc(o.id)}</b> (fixed; used in entity IDs)</div>` : `
      <label for="f-id">ID <span class="muted">(optional)</span></label>
      <input id="f-id" pattern="[a-z0-9_]{1,40}" placeholder="made from the name">
      <div class="hint">Lowercase letters, digits and _. Used in entity IDs and cannot be changed later.</div>`}
      <label for="f-tag">Tag ID</label>
      <select id="f-tag">${Array.from({ length: 30 }, (_, i) => `<option ${i === +v.tag_id ? "selected" : ""}>${i}</option>`).join("")}</select>
      <div class="hint">The tag16h5 ID printed on this object. Objects on the same camera need different IDs.
        <a href="api/tag/${v.tag_id}.png" target="_blank" id="f-print">Print this tag</a></div>
      <label>Camera source</label>
      <div class="row">
        <label class="inline"><input type="radio" name="src" value="go2rtc" ${v.source === "go2rtc" ? "checked" : ""}> go2rtc stream</label>
        <label class="inline"><input type="radio" name="src" value="ha_camera" ${v.source === "ha_camera" ? "checked" : ""}> Home Assistant camera</label>
      </div>
      <div id="f-go2rtc"><label for="f-stream">Stream</label>
        <input id="f-stream" list="streams" value="${esc(v.go2rtc_stream)}" placeholder="loading streams…">
        <datalist id="streams"></datalist>
        <div class="hint">Pick the highest-resolution stream that connects straight to the camera.</div></div>
      <div id="f-ha"><label for="f-entity">Camera entity</label>
        <select id="f-entity"><option value="">loading cameras…</option></select>
        <div class="hint">Also used as the fallback when fallback_source is ha_camera.</div></div>
      <div class="error" id="f-error"></div>
      <div class="row" style="margin-top:14px"><button class="primary" type="submit">${o ? "Save" : "Add"}</button>
        <a class="btn" href="${o ? "#/obj/" + o.id : "#/"}">Cancel</a></div>
    </form></div>`;
  const srcSel = () => document.querySelector("input[name=src]:checked").value;
  const toggle = () => { document.getElementById("f-go2rtc").style.display = srcSel() === "go2rtc" ? "" : "none"; };
  document.querySelectorAll("input[name=src]").forEach(r => r.addEventListener("change", toggle));
  toggle();
  document.getElementById("f-tag").addEventListener("change", e =>
    document.getElementById("f-print").href = `api/tag/${e.target.value}.png`);
  api("sources").then(src => {
    document.getElementById("streams").innerHTML = src.go2rtc.map(s => `<option value="${esc(s)}">`).join("");
    document.getElementById("f-stream").placeholder = src.go2rtc.length ? "choose or type a stream" : "type a stream name";
    const ent = document.getElementById("f-entity");
    ent.innerHTML = `<option value="">${src.ha_cameras.length ? "(none)" : "no cameras found"}</option>` +
      src.ha_cameras.map(c => `<option value="${esc(c.entity_id)}" ${c.entity_id === v.camera_entity ? "selected" : ""}>${esc(c.name)} (${esc(c.entity_id)})</option>`).join("");
    if (v.camera_entity && !src.ha_cameras.some(c => c.entity_id === v.camera_entity))
      ent.insertAdjacentHTML("beforeend", `<option selected value="${esc(v.camera_entity)}">${esc(v.camera_entity)}</option>`);
    const errs = Object.entries(src.errors || {}).map(([k, e]) => `${k}: ${e}`).join("\n");
    if (errs) document.getElementById("f-error").textContent = "Could not list sources:\n" + errs;
  });
  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault();
    const body = { name: document.getElementById("f-name").value.trim(),
      tag_id: +document.getElementById("f-tag").value, source: srcSel(),
      go2rtc_stream: document.getElementById("f-stream").value.trim(),
      camera_entity: document.getElementById("f-entity").value };
    if (!o) body.id = document.getElementById("f-id").value.trim();
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      const r = o ? await api(`objects/${o.id}`, { method: "PUT", body })
                  : await api("objects", { method: "POST", body });
      await refresh();
      location.hash = "#/obj/" + r.id;
    } catch (err) {
      document.getElementById("f-error").textContent = err.message;
      btn.disabled = false; btn.textContent = o ? "Save" : "Add";
    }
  });
}

(async () => {
  try { state = await api("state"); } catch (e) { $main.innerHTML = `<div class="loading">Could not reach TagSense: ${esc(e.message)}</div>`; }
  document.getElementById("version").textContent = state.version ? "v" + state.version : "";
  render(false);
  schedule();
})();
</script>
</body>
</html>
