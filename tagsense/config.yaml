name: TagSense (dev)
version: "0.5.1b5"
slug: tagsense
description: Detect whether tagged objects (bin, car, chair...) are in place from AprilTags, published to HA via MQTT.
url: https://github.com/lsnewman/ha-tagsense
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
services:
  - mqtt:want
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:tag-search
panel_title: TagSense
panel_admin: false   # every HA user sees TagSense, but only admins get past the pass page
# The detection settings are set in the panel (Settings). Their keys stay in the
# schema as optional for now, so 0.5.1 can copy existing values on its first start.
options:
  go2rtc_url: ""
  access_enabled: false
schema:
  go2rtc_url: str
  max_aspect: float(0,20)?
  min_size_ratio: float(0,1)?
  burst_size: int(1,20)?
  burst_interval_s: float(0,10)?
  present_min_hits: int(1,3)?
  absent_checks: int(1,20)?
  confirm_delay_s: int(5,600)?
  unknown_after_failures: int(1,5)?
  sanity_min_ratio: float(0,1)?
  sanity_min_h: float(0,10)?
  log_level: list(debug|info|warning|error)?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  access_enabled: bool
  access_mqtt_username: str?
  access_mqtt_password: password?
